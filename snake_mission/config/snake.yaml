# ═══════════════════════════════════════════════════════════════════════
#  Миссия лидера: полёт по ArUco-меткам, поиск «яблок»
# ═══════════════════════════════════════════════════════════════════════
#
#  ЧТО ДЕЛАТЬ, ЕСЛИ...
#
#  дрон не находит метку под собой ..... markers.dictionary (какой словарь на поле),
#                                        markers.min_marker_percent → меньше
#  ID меток не совпадают с узлами ...... markers.row_major / flip_x / flip_y
#                                        (проверить: tools/marker_check.py)
#  дрон долго «ловит» метку ............ navigation.center_tolerance → больше,
#                                        navigation.hold_frames → меньше
#  дрон дёргается над меткой ........... navigation.center_tolerance → больше,
#                                        flight.speed → меньше
#  не укладываемся в 3 минуты .......... flight.altitude → выше (полоса обзора шире),
#                                        search.max_pass_spacing → больше,
#                                        navigation.stabilize_timeout → меньше
#  яблоки теряются на высоте ........... flight.altitude → ниже и подстроить
#                                        min_size_percent в apple_vision/config/apples.yaml
#
#  Посчитать маршрут и время до полёта:
#      python3 tools/plan_preview.py --start 42
# ═══════════════════════════════════════════════════════════════════════

# ── ПОЛЁТ ─────────────────────────────────────────────────────────────
# Регламент п. 2.6.3: не выше 4 м. Полёты в защитной сетке 4 м, поэтому
# свой потолок — 3 м, конфиг выше не примет.
flight:
  altitude: 2.5          # рабочая высота поиска, м (потолок 3.0)
  speed: 0.6             # скорость перелёта между метками, м/с
  takeoff_timeout: 20    # сколько ждать выхода на высоту, с
  yaw: 0.0               # курс постоянный весь поиск, рад
  land_at_end: true      # false — зависнуть на старте и ждать этапа фигуры

# ── МЕТКИ ─────────────────────────────────────────────────────────────
# Поле — 49 меток в квадрате 7×7. ID = row*7 + col, углы 0 / 6 / 42 / 48
# (Приложение 3 регламента). Если раскладка на площадке зеркальная —
# правятся флаги ниже, а не код.
markers:
  dictionary: DICT_4X4_50   # ID меток 0..48 → словарь 4x4 на 50 меток
  min_marker_percent: 0.02  # меньше этой доли кадра — метка слишком мелкая, игнорируем
  row_major: true           # false — ID растёт по столбцам: ID = col*7 + row
  flip_x: false             # true — столбцы пронумерованы справа налево
  flip_y: false             # true — строки пронумерованы сверху вниз

# ── НАВИГАЦИЯ ПО МЕТКАМ ───────────────────────────────────────────────
# Допуски заданы в долях диагонали кадра, а не в пикселях: одинаково
# работают на камере дрона и на любом другом разрешении.
navigation:
  strategy: auto            # auto | aruco_frame (frame_id=aruco_N) | visual (наведение по кадру)
  arrive_tolerance: 0.10    # «прилетели»: метка ближе этой доли диагонали к центру кадра
  center_tolerance: 0.06    # «стабилизирован»: то же, но строже
  hold_frames: 3            # кадров подряд в допуске до зачёта стабилизации
  settle_speed: 0.15        # и горизонтальная скорость ниже этой, м/с
  goto_timeout: 12.0        # предел на перелёт до соседней метки, с
  stabilize_timeout: 3.0    # предел на стабилизацию над меткой, с
  lost_marker_timeout: 4.0  # метки не видно так долго → бросаем узел и летим дальше
  frame_timeout: 1.0        # ожидание кадра с камеры, с
  poll_interval: 0.15       # период циклов управления, с
  frame_tolerance: 0.12     # попадание в узел по фрейму aruco_N, м

# ── ПОИСКОВЫЙ МАРШРУТ ─────────────────────────────────────────────────
# Проходы разрежаются по измеренной полосе обзора (в метках, не в метрах):
# видно 3 ряда меток → радиус 1 → проходы по рядам 1, 4, 6 вместо всех семи.
search:
  safety_markers: 0      # вычитается из радиуса полосы обзора; 1 = проход по каждому ряду
  max_pass_spacing: 3    # шире не разрежаем, даже если камера видит больше
  default_span: 3        # рядов меток в кадре, если измерить не удалось
  apple_hold_s: 12.0     # оценка зависания на одно яблоко, с
  step_time_s: 2.2       # оценка одного перелёта, с
  stabilize_time_s: 1.2  # оценка одной стабилизации, с

# ── РОЙ ───────────────────────────────────────────────────────────────
# Регламент п. 2.1.2: лидер не двигается, пока новый дрон не встал в хвост
# и дистанция по UWB не подтвердила строй. Здесь только тайминги ожидания;
# сам канал связи подставляется через SwarmLink.
swarm:
  join_timeout: 30.0     # предел ожидания подтверждения входа в хвост, с
  join_wait_s: 8.0       # заглушка ConsoleSwarmLink: столько «занимает» вход, с

# ── ПРОЧЕЕ ────────────────────────────────────────────────────────────
formation_budget: 180    # регламент п. 2.1.3: 3 минуты на сборку формации, с
apples_config: ""        # путь к своему apples.yaml; пусто = штатный из apple_vision
