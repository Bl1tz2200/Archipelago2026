# Тестовый профиль: пролёт всего поля змейкой на фиксированной высоте 0.5 м,
# без набора высоты и без обрыва по 3-минутному регламентному бюджету.
# Запуск: python3 run.py mission --config snake_mission/config/test_0_5m.yaml
flight:
  altitude: 0.5          # рабочая высота теста, м
  speed: 0.3             # медленнее дефолта (0.6) — первый пролёт на малой высоте
  auto_altitude: false   # не подниматься, даже если маршрут не влезает в 180 с
  land_at_end: true      # аккуратная посадка в конце маршрута

# --config читает этот файл отдельно от snake.yaml (без слияния), поэтому
# зеркальность поля дублируется и сюда — иначе тест навигации попытается
# лететь по немирроренной раскладке.
markers:
  flip_x: true

# Полное покрытие 7×7 при любой полосе обзора — это ~185-220 с (перелёты +
# стабилизация + возврат). Регламентные 180 с тут ни при чём — это тест
# навигации, а не зачётная попытка, поэтому бюджет просто отодвинут с запасом.
formation_budget: 900
