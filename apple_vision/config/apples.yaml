# Цветовые профили «яблок» для соревнования «Змейка».
#
# HSV в формате OpenCV: H 0..179, S 0..255, V 0..255.
# У каждого профиля список диапазонов (для красного их два — он «разорван» на краях круга H).
# Пороги ОБЯЗАТЕЛЬНО переподбирать на площадке под её освещение:
#     python3 tools/calibrate_hsv.py --live      (на дроне)
#     python3 tools/calibrate_hsv.py --image кадр.png
#
# Геометрические фильтры отсекают всё, что по форме не похоже на яблоко
# (блики, полосы разметки, чужие предметы). Регламент гарантирует, что
# похожих на «яблоки» объектов в зоне нет, поэтому фильтры держим мягкими.

detector:
  blur_ksize: 5          # медианное размытие перед HSV, 0 = выключить
  resize_width: 0        # 0 = обрабатывать кадр как есть; 320/480 ускоряют на слабой плате
  morph_ksize: 5         # ядро морфологии (open → close), убирает шум и дырки
  morph_iterations: 1
  max_per_color: 1       # яблок каждого цвета на поле максимум одно
  min_score: 0.35        # общая оценка «похожести на яблоко» 0..1

profiles:
  - name: red
    label: "Красное яблоко"
    draw_bgr: [0, 0, 255]
    ranges:
      - lower: [0, 110, 70]
        upper: [8, 255, 255]
      - lower: [170, 110, 70]
        upper: [179, 255, 255]
    min_area: 400        # px² при 640x480 с высоты ~1.5 м
    max_area: 120000
    min_circularity: 0.55
    min_solidity: 0.80
    min_fill: 0.45       # доля пикселей маски внутри minEnclosingCircle

  - name: green
    label: "Зелёное яблоко"
    draw_bgr: [0, 200, 0]
    ranges:
      - lower: [38, 80, 50]
        upper: [85, 255, 255]
    min_area: 400
    max_area: 120000
    min_circularity: 0.55
    min_solidity: 0.80
    min_fill: 0.45

  - name: yellow
    label: "Жёлтое яблоко"
    draw_bgr: [0, 220, 220]
    ranges:
      - lower: [20, 110, 90]
        upper: [34, 255, 255]
    min_area: 400
    max_area: 120000
    min_circularity: 0.55
    min_solidity: 0.80
    min_fill: 0.45

# Логика однократного зачёта и подтверждения обнаружения.
registry:
  confirm_frames: 4      # столько кадров подряд цель должна быть видна, чтобы засчитаться
  lost_frames: 3         # столько кадров без цели — счётчик подтверждения сбрасывается
  track_radius_px: 120   # разброс центра между кадрами, при котором это тот же объект
  merge_radius_m: 0.6    # два срабатывания ближе этого в map — одно и то же яблоко
  unique_by_color: true  # цвета «яблок» различны (см. регламент) → цвет = идентификатор
  max_apples: 3          # всего яблок на поле

# Проекция пикселя в координаты пола. Нужна только для логов/дедупликации по месту,
# на само распознавание не влияет.
camera:
  # Путь к результату калибровки; если файла нет — интринсики оцениваются по FOV.
  calibration_file: "~/camera_calibrations/latest_calibration.yaml"
  fallback_hfov_deg: 65.0
  # Разворот камеры относительно корпуса: на сколько градусов «верх кадра»
  # повёрнут от направления «вперёд» дрона (по часовой стрелке, вид сверху).
  yaw_offset_deg: 0.0
  mirror_x: false        # true, если изображение зеркалится по горизонтали
