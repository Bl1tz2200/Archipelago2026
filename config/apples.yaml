# ═══════════════════════════════════════════════════════════════════════
#  Настройки распознавания «яблок»
# ═══════════════════════════════════════════════════════════════════════
#
#  ЧТО ДЕЛАТЬ, ЕСЛИ...
#
#  яблоко не находится вообще ...... переснять цвет: tools/calibrate_hsv.py
#                                    (или в окне вебки: навести в рамку и нажать c)
#  находится только вблизи ......... min_size_percent → меньше
#  ловит лишнее на фоне ............ min_size_percent → больше,
#                                    min_roundness / min_filling → больше
#  срабатывает раньше времени ...... confirm_frames → больше
#  реагирует слишком поздно ........ confirm_frames → меньше
#  тормозит на плате дрона ......... resize_width: 480, blur_ksize: 3
#  одно яблоко засчиталось дважды .. merge_radius_m → больше
#
#  Проверить, что получилось:
#      python3 tools/offline_test.py --image кадр.png --masks --out проверка.png
#
#  Размеры заданы в ПРОЦЕНТАХ ПЛОЩАДИ КАДРА, а не в пикселях, поэтому одни и те
#  же значения работают и на камере дрона, и на вебке с другим разрешением.
# ═══════════════════════════════════════════════════════════════════════


detector:
  blur_ksize: 5         # сглаживание перед разбором цвета (нечётное), 0 = выключить
  resize_width: 0       # 0 = кадр как есть; 480 или 320 = быстрее, но грубее
  morph_ksize: 5        # чистка маски от точечного шума
  morph_iterations: 1   # сколько раз чистить
  max_per_color: 1      # сколько яблок одного цвета может быть на поле
  min_score: 0.35       # общая оценка «похоже на яблоко», 0..1

# ── ЦВЕТА ЯБЛОК ───────────────────────────────────────────────────────
# HSV: H — оттенок 0..179, S — насыщенность 0..255, V — яркость 0..255.
# Проще всего не править руками, а переснять: tools/calibrate_hsv.py
profiles:

  - name: red
    label: "Красное яблоко"
    draw_bgr: [0, 0, 255]   # цвет обводки на картинке (B, G, R)
    ranges:            # два диапазона: оттенок лежит по обе стороны от нуля
      - {lower: [0, 110, 70], upper: [8, 255, 255]}
      - {lower: [170, 110, 70], upper: [179, 255, 255]}
    min_size_percent: 0.1302    # меньше этой доли кадра — шум, не яблоко
    max_size_percent: 39.0625   # больше — это уже не яблоко
    min_roundness: 0.55         # круглость: 1.00 = идеальный круг
    min_smoothness: 0.8         # ровность контура: 1.00 = без вырезов и заусенцев
    min_filling: 0.45           # плотность: насколько пятно заполняет свой круг
    enabled: true               # false = не искать этот цвет

  - name: green
    label: "Зелёное яблоко"
    draw_bgr: [0, 200, 0]   # цвет обводки на картинке (B, G, R)
    ranges:
      - {lower: [38, 80, 50], upper: [85, 255, 255]}
    min_size_percent: 0.1302    # меньше этой доли кадра — шум, не яблоко
    max_size_percent: 39.0625   # больше — это уже не яблоко
    min_roundness: 0.55         # круглость: 1.00 = идеальный круг
    min_smoothness: 0.8         # ровность контура: 1.00 = без вырезов и заусенцев
    min_filling: 0.45           # плотность: насколько пятно заполняет свой круг
    enabled: true               # false = не искать этот цвет

  - name: yellow
    label: "Жёлтое яблоко"
    draw_bgr: [0, 220, 220]   # цвет обводки на картинке (B, G, R)
    ranges:
      - {lower: [20, 110, 90], upper: [34, 255, 255]}
    min_size_percent: 0.1302    # меньше этой доли кадра — шум, не яблоко
    max_size_percent: 39.0625   # больше — это уже не яблоко
    min_roundness: 0.55         # круглость: 1.00 = идеальный круг
    min_smoothness: 0.8         # ровность контура: 1.00 = без вырезов и заусенцев
    min_filling: 0.45           # плотность: насколько пятно заполняет свой круг
    enabled: true               # false = не искать этот цвет

# ── КОГДА СЧИТАТЬ ЯБЛОКО НАЙДЕННЫМ ────────────────────────────────────
registry:
  confirm_frames: 4       # кадров подряд до зачёта: больше = надёжнее, но позже
  lost_frames: 3          # кадров без цели, после которых счётчик подтверждений обнуляется
  track_radius_px: 120    # насколько центр может прыгнуть между кадрами, пиксели
  merge_radius_m: 0.6     # ближе этого на полу — считаем тем же яблоком, метры
  unique_by_color: true   # цвета яблок различны → цвет и есть номер яблока
  max_apples: 3           # сколько всего яблок на поле (по регламенту 3)

# ── КАМЕРА (нужна только для координат яблок в логе) ───────────────────
camera:
  calibration_file: "~/camera_calibrations/latest_calibration.yaml"   # результат калибровки камеры; нет файла — берётся угол ниже
  fallback_hfov_deg: 65                                               # горизонтальный угол обзора камеры, градусы
  yaw_offset_deg: 0                                                   # поворот камеры относительно носа дрона: 0 / 90 / 180 / 270
  mirror_x: false                                                     # true, если картинка зеркальна по горизонтали
